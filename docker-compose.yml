# =====================================================================
# Banco XYZ - Semana 8
# Orquesta la plataforma con un solo comando:   docker compose up -d --build
# Cada servicio tiene build: (compila desde el codigo) e image: (la misma imagen que publica GitHub Actions).
#
#   Infraestructura : zookeeper, kafka, kafka-ui
#   Seguridad       : auth-server   (OAuth2.0, emite JWT)
#   Microservicios  : ms-core-banco, bff-cajeros
#   (bff-web y bff-movil: ver docker-compose.bff-lectura.yml)
#
# Dentro de la red de Docker los servicios se hablan por NOMBRE
# (kafka:29092, auth-server:9000, ms-core-banco:8090), nunca por localhost.
# =====================================================================

services:

  # ---------------- Mensajeria (Kafka) ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # acceso desde tu maquina (herramientas externas)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # kafka:29092 -> trafico entre contenedores | localhost:9092 -> desde tu maquina
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  # ---------------- Seguridad (OAuth2.0) ----------------
  auth-server:
    build: ./auth-server
    image: dericesn/auth-server:latest
    container_name: auth-server
    ports:
      - "9000:9000"
    environment:
      CAJERO_CLIENT_SECRET: ${CAJERO_CLIENT_SECRET:-cajero123}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:-web123}
      MOVIL_CLIENT_SECRET: ${MOVIL_CLIENT_SECRET:-movil123}
      BFF_CAJEROS_SERVICE_SECRET: ${BFF_CAJEROS_SERVICE_SECRET:-cajerossvc123}
      BFF_WEB_SERVICE_SECRET: ${BFF_WEB_SERVICE_SECRET:-websvc123}
      BFF_MOVIL_SERVICE_SECRET: ${BFF_MOVIL_SERVICE_SECRET:-movilsvc123}
    restart: unless-stopped

  # ---------------- Microservicios ----------------
  ms-core-banco:
    build: ./banco
    image: dericesn/ms-core-banco:latest
    container_name: ms-core-banco
    depends_on:
      kafka:
        condition: service_healthy
      auth-server:
        condition: service_started
    ports:
      - "8090:8090"   # expuesto SOLO para demostrar que sin token responde 401
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_JWKS_URI: http://auth-server:9000/oauth2/jwks
    restart: unless-stopped

  bff-cajeros:
    build: ./banco_cajero/banco
    image: dericesn/bff-cajeros:latest
    container_name: bff-cajeros
    depends_on:
      kafka:
        condition: service_healthy
      auth-server:
        condition: service_started
      ms-core-banco:
        condition: service_started
    ports:
      - "8094:8094"   # HTTPS
    environment:
      CORE_BASE_URL: http://ms-core-banco:8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_JWKS_URI: http://auth-server:9000/oauth2/jwks
      AUTH_TOKEN_URI: http://auth-server:9000/oauth2/token
      BFF_CAJEROS_SERVICE_SECRET: ${BFF_CAJEROS_SERVICE_SECRET:-cajerossvc123}
    restart: unless-stopped
